name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Browser evals
        run: uv run python evals/run.py
        env:
          CHROME_PATH: /usr/bin/google-chrome
